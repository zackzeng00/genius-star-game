<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Genius Star 拼图游戏 - 交互式六角星拼图">
    <title>🌟 Genius Star 拼图游戏</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="game-container">
        <!-- 标题区域 -->
        <header class="game-header">
            <h1>🌟 Genius Star</h1>
            <p class="subtitle">天才之星拼图游戏</p>
        </header>

        <!-- 主游戏区域 -->
        <main class="game-main">
            <!-- 左侧：棋盘 + 拼块 -->
            <div class="left-column">
                <div class="board-section">
                    <svg id="board-svg" viewBox="-6 -6 12 12" class="board-svg">
                        <!-- 棋盘将由 JavaScript 渲染 -->
                    </svg>
                </div>

                <!-- 底部：拼块区域 -->
                <section class="pieces-section">
                    <h3>🧩 拼块</h3>
                    <div id="pieces-container" class="pieces-container">
                        <!-- 拼块将由 JavaScript 渲染 -->
                    </div>
                </section>
            </div>

            <!-- 右侧：控制面板（抽屉式） -->
            <aside class="control-panel" id="control-panel">

                <div class="drawer-content">
                    <div class="panel-section">
                        <h3>🎮 游戏控制</h3>
                        <button id="btn-roll" class="btn btn-primary">
                            <span class="btn-icon">🎲</span> 随机骰子
                        </button>
                        <button id="btn-apply-dice" class="btn btn-secondary">
                            <span class="btn-icon">✓</span> 应用选择
                        </button>
                        <button id="btn-reset" class="btn btn-secondary">
                            <span class="btn-icon">🔄</span> 重置
                        </button>
                        <button id="btn-solve" class="btn btn-accent">
                            <span class="btn-icon">💡</span> 自动求解
                        </button>
                        <button id="btn-check" class="btn btn-success">
                            <span class="btn-icon">✓</span> 检查
                        </button>
                    </div>

                    <div class="panel-section dice-section">
                        <h3>🎲 骰子选择 <span class="dice-hint">（点击选择）</span></h3>
                        <div id="dice-selectors" class="dice-selectors">
                            <!-- 骰子选择器由 JavaScript 渲染 -->
                        </div>
                    </div>

                    <div class="panel-section">
                        <h3>📊 状态</h3>
                        <div id="status-message" class="status-message">
                            点击「摇骰子」开始游戏！
                        </div>
                    </div>
                </div>
            </aside>


    </div>

    <!-- 完成弹窗 -->
    <div id="victory-modal" class="modal hidden">
        <div class="modal-content">
            <h2>🎉 恭喜完成！</h2>
            <p>你成功完成了拼图！</p>
            <button id="btn-new-game" class="btn btn-primary">开始新游戏</button>
        </div>
    </div>

    <!-- 移动端底部固定操作栏 -->
    <div class="mobile-controls">
        <button id="btn-mobile-rotate" class="mobile-btn">
            <span class="icon">🔄</span>
            <span class="label">旋转</span>
        </button>
        <button id="btn-mobile-flip" class="mobile-btn">
            <span class="icon">↔️</span>
            <span class="label">翻转</span>
        </button>
        <button id="btn-mobile-reset" class="mobile-btn warning">
            <span class="icon">🔄</span>
            <span class="label">重置</span>
        </button>
        <button id="btn-mobile-menu" class="mobile-btn">
            <span class="icon">☰</span>
            <span class="label">菜单</span>
        </button>
    </div>

    <!-- JavaScript 模块 -->
    <script src="js/geometry.js"></script>
    <script src="js/pieces.js"></script>
    <script src="js/board.js"></script>
    <script src="js/solver.js"></script>
    <script src="js/game.js"></script>
</body>

</html>
